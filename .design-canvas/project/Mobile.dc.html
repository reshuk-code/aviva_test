<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin overview on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#8a4a00}a:hover{color:#1d1c1b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #f6f3ee; color: #1d1c1b; font-family: Inter, system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1b1918; color: #f5f3ef">
<button type="button" aria-label="Open navigation" style="width: 44px; height: 44px; border: 1px solid #3a3633; border-radius: 12px; background: transparent; color: #f5f3ef; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
</button>
<span style="flex-grow: 1; font-size: 19px; font-weight: 700; letter-spacing: 0.04em; color: #ff8a00">AVIVA</span>
<a href="Quotes.dc.html" aria-label="Quote requests, 2 unread" style="position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #f5f3ef">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2ZM3 7l9 6 9-6"></path></svg>
<span style="position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #ff8a00; color: #1b1918">2</span>
</a>
</header>
<main style="flex-grow: 1; overflow: hidden; padding: 22px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em">Studio overview</h1>
<p style="margin: 0; font-size: 14px; color: #5f5a54">Two quote requests are waiting for a reply.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{stats}}" as="stat" hint-placeholder-count="4">
<a href="{{stat.href}}" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: #ffffff; border: 1px solid #e7e2da; border-radius: 14px; text-decoration: none; color: #1d1c1b">
<span style="font-size: 13px; color: #5f5a54">{{stat.label}}</span>
<span style="font-size: 32px; line-height: 1; font-weight: 700; letter-spacing: -0.04em">{{stat.value}}</span>
<span style="font-size: 12px; color: #5f5a54">{{stat.detail}}</span>
</a>
</sc-for>
</div>
<section aria-labelledby="mobile-quotes" style="background: #ffffff; border: 1px solid #e7e2da; border-radius: 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px">
<h2 id="mobile-quotes" style="margin: 0; font-size: 17px; font-weight: 600">Latest quote requests</h2>
<a href="Quotes.dc.html" style="font-size: 13px; font-weight: 500; padding: 12px 0">View all</a>
</div>
<sc-for list="{{quotes}}" as="quote" hint-placeholder-count="3">
<a href="Quotes.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid #f0ece5; text-decoration: none; color: #1d1c1b">
<span aria-hidden="true" style="width: 38px; height: 38px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: #fdebd2; color: #6b3d00">{{quote.initials}}</span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: {{quote.weight}}">{{quote.name}}</span>
<span style="font-size: 12px; color: #5f5a54; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{quote.subject}}</span>
</span>
<sc-if value="{{quote.unread}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: #ff8a00; color: #1b1918">New</span></sc-if>
</a>
</sc-for>
</section>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; border: 0; border-radius: 14px; font: inherit; font-size: 15px; font-weight: 600; background: #ff8a00; color: #1b1918; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
New project
</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
stats: [
{ label: 'Projects', value: '04', detail: '3 published, 1 draft', href: 'Projects.dc.html' },
{ label: 'Blog posts', value: '03', detail: '2 published, 1 draft', href: '#blog' },
{ label: 'Quote requests', value: '03', detail: '2 unread', href: 'Quotes.dc.html' },
{ label: 'Team members', value: '04', detail: 'All published', href: '#team' }
],
quotes: [
{ initials: 'SC', name: 'Sophie Chen', subject: 'A fresh identity for our studio', unread: true, weight: 600 },
{ initials: 'JW', name: 'James Wilson', subject: 'Let’s talk about a new website', unread: true, weight: 600 },
{ initials: 'AS', name: 'Aarav Sharma', subject: 'Campaign collaboration', unread: false, weight: 500 }
]
};
}
}
</script>
</body>
</html>
